<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Binary Tech - Sign In</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img src="images/logo.png" alt="Big Binary Tech" class="login-logo">
        <div>
          <h1 class="login-title">BIG BINARY <span class="tech-tag">TECH</span></h1>
          <span class="login-sub">Lead Intelligence Engine</span>
        </div>
      </div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="login-field">
          <label class="form-label" for="email">Work email</label>
          <input type="email" id="email" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="login-field">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Sign In</button>
      </form>

      <div class="login-foot">Access is restricted to Big Binary team members.</div>
    </div>
  </div>

  <script>
    // If already signed in, skip the login screen.
    fetch('/api/auth/me').then(r => { if (r.ok) location.href = 'index.html'; }).catch(() => {});

    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errBox = document.getElementById('loginError');
      errBox.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Sign in failed');
        location.href = 'index.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }
  </script>
</body>

</html>
